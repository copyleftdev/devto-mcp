[package]
name = "devto-text"
description = "Text analysis for DEV (Forem) articles: segmentation, textstat-exact counts, readability"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fst = "0.4"
pulldown-cmark = { version = "0.13", default-features = false }
serde.workspace = true

[dev-dependencies]
hegeltest.workspace = true
serde_json.workspace = true
serde = { workspace = true }

[[bin]]
name = "build-syllable-fst"
path = "scripts/build_syllable_fst.rs"
required-features = ["build-data"]

[features]
build-data = []
