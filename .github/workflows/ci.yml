name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      # Runs fmt, clippy -D warnings, the suite, and cargo mutants to zero survivors.
      # CI=1 is exported by the script itself so the property tests derandomize: with
      # random draws a mutation score means nothing.
      - name: Gate
        run: ./scripts/gate.sh
        env:
          # Build parallelism for fmt/clippy/test on a four-core runner.
          JOBS: 2
          # The mutation sweep is bounded separately by scripts/bounded-mutants, which
          # derives -j and --jobserver-tasks from this one number. Two leaves each mutant
          # test roughly one core, which is what pushed the slowest ones past the old
          # timeout. The runner has no user session bus, so the cgroup ceiling is skipped
          # there and the cooperative limits carry it.
          MUTANT_CPU_BUDGET: 2
          MUTANT_TIMEOUT: 600
