name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-mutants
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants

      # Runs fmt, clippy -D warnings, the suite, and cargo mutants to zero survivors.
      # CI=1 is exported by the script itself so the property tests derandomize: with
      # random draws a mutation score means nothing.
      - name: Gate
        run: ./scripts/gate.sh
        env:
          # Build parallelism for fmt/clippy/test on a four-core runner.
          JOBS: 2
          # The mutation sweep is bounded separately by scripts/bounded-mutants, which
          # derives -j and --jobserver-tasks from this one number. Two leaves each mutant
          # test roughly one core, which is what pushed the slowest ones past the old
          # timeout. The runner has no user session bus, so the cgroup ceiling is skipped
          # there and the cooperative limits carry it.
          MUTANT_CPU_BUDGET: 2
          MUTANT_TIMEOUT: 600

  manifests:
    name: Registry manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # These two files are how the server is found and installed, and nothing else in the
      # suite touches them. A description one character over the limit is rejected at publish
      # time, which is the wrong moment to find out.
      - name: server.json against the published schema
        run: |
          curl -fsSL https://static.modelcontextprotocol.io/schemas/2025-12-11/server.schema.json -o /tmp/server.schema.json
          python3 -m pip install --quiet jsonschema
          python3 - <<'PY'
          import json, jsonschema, sys
          errs = sorted(
              jsonschema.Draft202012Validator(json.load(open("/tmp/server.schema.json")))
              .iter_errors(json.load(open("server.json"))),
              key=lambda e: list(e.path),
          )
          for e in errs:
              print(f"server.json {list(e.path)}: {e.message}", file=sys.stderr)
          sys.exit(1 if errs else 0)
          PY

      - name: manifest.json against the MCPB schema
        run: npx -y @anthropic-ai/mcpb@latest validate mcpb/manifest.json

      # The bundle declares the tools it provides; the server is the authority on that list.
      - name: The declared tools are the tools the server serves
        run: |
          rustup toolchain install stable --profile minimal
          cargo build --release --locked -p devto-mcp
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | ./target/release/devto-mcp > tools.jsonl
          python3 - <<'PY'
          import json, sys
          served = set()
          for line in open("tools.jsonl"):
              line = line.strip()
              if not line:
                  continue
              m = json.loads(line)
              if m.get("id") == 2:
                  served = {t["name"] for t in m["result"]["tools"]}
          declared = {t["name"] for t in json.load(open("mcpb/manifest.json"))["tools"]}
          if served != declared:
              print(f"declared but not served: {sorted(declared - served)}", file=sys.stderr)
              print(f"served but not declared: {sorted(served - declared)}", file=sys.stderr)
              sys.exit(1)
          print(f"{len(served)} tools, declared and served agree")
          PY
