name: Release

# Prebuilt binaries, because the audience for an MCP server is people who want to register
# one — not people who want to install a Rust toolchain first. The binary is self-contained:
# CMUdict and the hyphenation patterns are compiled in, so there is nothing to fetch at
# runtime and nothing to configure but the API key.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # These take about a minute. The cap is here so an unavailable or retired runner label
    # fails loudly instead of queueing until someone notices the release never appeared.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  ext: "" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, ext: "" }
          - { os: macos-latest,   target: aarch64-apple-darwin,      ext: "" }
          # macos-13 was retired on 2025-12-04. A retired label does not fail — the job
          # sits queued forever, which is why this is pinned rather than left on a guess.
          # macos-15-intel is the last x86_64 image and is available until August 2027.
          - { os: macos-15-intel, target: x86_64-apple-darwin,       ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    ext: ".exe" }
    steps:
      - uses: actions/checkout@v5

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p devto-mcp

      # The one thing worth checking on every platform: that it starts, speaks the handshake,
      # and lists its tools. A binary that builds and cannot be registered is not a release.
      - name: Smoke-test the binary
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/devto-mcp${{ matrix.ext }}"
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | "$BIN" > out.jsonl
          grep -q '"serverInfo"' out.jsonl || { echo "no initialize result"; cat out.jsonl; exit 1; }
          grep -q '"validate_draft"' out.jsonl || { echo "no tools listed"; cat out.jsonl; exit 1; }
          echo "handshake and tools/list ok on ${{ matrix.target }}"

      - name: Package
        shell: bash
        run: |
          NAME="devto-mcp-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          cp "target/${{ matrix.target }}/release/devto-mcp${{ matrix.ext }}" "dist/$NAME/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$NAME/"
          cd dist
          if [ "${{ matrix.ext }}" = ".exe" ]; then
            7z a "$NAME.zip" "$NAME"
          else
            tar czf "$NAME.tar.gz" "$NAME"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip

      # The bundle job needs the bare executable, not the packaged archive.
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/devto-mcp${{ matrix.ext }}

  bundle:
    name: MCP bundle
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: bins

      # One bundle carrying every target. `server.json` has no field for an operating system
      # or a CPU, and a manifest's platform_overrides separate darwin/linux/win32 but not
      # arm64 from x86_64 — so the launchers choose, and the registry gets one artifact with
      # one checksum instead of five entries a client would have to pick between.
      - name: Assemble
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p bundle/server/linux bundle/server/darwin bundle/server/windows
          cp bins/bin-x86_64-unknown-linux-gnu/devto-mcp   bundle/server/linux/devto-mcp-x86_64
          cp bins/bin-aarch64-unknown-linux-gnu/devto-mcp  bundle/server/linux/devto-mcp-aarch64
          cp bins/bin-x86_64-apple-darwin/devto-mcp        bundle/server/darwin/devto-mcp-x86_64
          cp bins/bin-aarch64-apple-darwin/devto-mcp       bundle/server/darwin/devto-mcp-aarch64
          cp bins/bin-x86_64-pc-windows-msvc/devto-mcp.exe bundle/server/windows/devto-mcp.exe
          cp mcpb/launchers/launch.sh bundle/server/linux/
          cp mcpb/launchers/launch.sh bundle/server/darwin/
          chmod +x bundle/server/linux/* bundle/server/darwin/* 
          cp README.md LICENSE-MIT LICENSE-APACHE PRIVACY.md bundle/
          cp mcpb/icon.png bundle/icon.png
          jq --arg v "$VERSION" '.version = $v' mcpb/manifest.json > bundle/manifest.json
          npx -y @anthropic-ai/mcpb@latest validate bundle/manifest.json

      - name: Pack
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          npx -y @anthropic-ai/mcpb@latest pack bundle "dist/devto-mcp-v$VERSION.mcpb"

      # A bundle's hash is only knowable once it is built, and `fileSha256` is required for an
      # mcpb package — so the checked-in server.json carries an obvious placeholder and the
      # real values are written here. Publishing an unrewritten one should fail loudly.
      - name: Stamp server.json
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BUNDLE="dist/devto-mcp-v$VERSION.mcpb"
          SHA=$(sha256sum "$BUNDLE" | cut -d' ' -f1)
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/devto-mcp-v$VERSION.mcpb"
          jq --arg v "$VERSION" --arg sha "$SHA" --arg url "$URL" '
            .version = $v
            | .packages[0].version = $v
            | .packages[0].identifier = $url
            | .packages[0].fileSha256 = $sha
          ' server.json > dist/server.json
          grep -q '0000000000' dist/server.json && { echo "placeholder survived"; exit 1; }
          echo "sha256 $SHA"
          cat dist/server.json

      - name: Check the bundle actually runs
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p verify && cd verify
          unzip -q "../dist/devto-mcp-v$VERSION.mcpb"
          chmod +x server/linux/launch.sh server/linux/devto-mcp-*
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | ./server/linux/launch.sh > out.jsonl
          grep -q '"validate_draft"' out.jsonl || { echo "bundle does not serve tools"; cat out.jsonl; exit 1; }
          echo "unpacked bundle serves its tools"

      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: |
            dist/*.mcpb
            dist/server.json

  release:
    needs: [build, bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Only the packaged archives and the bundle. The `bin-*` artifacts exist so the bundle
      # job can assemble them and must not reach the release: four of the five targets build
      # a file named exactly `devto-mcp`, so `merge-multiple` collapses them into one
      # unlabelled binary and whichever finished last wins. v0.1.0 shipped a `devto-mcp` that
      # was Mach-O x86_64 — a Linux user downloading it would get a macOS binary.
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: dist

      - name: Nothing unpackaged may ship
        run: |
          cd dist
          ls -la
          for f in *; do
            case "$f" in
              *.tar.gz|*.zip|*.mcpb|server.json) ;;
              *) echo "unexpected release asset: $f" >&2; exit 1 ;;
            esac
          done

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
